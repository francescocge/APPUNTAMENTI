<!DOCTYPE html>
<html lang="it">
<head>
<!-- Cruscotto Messaggi WhatsApp - Servizi Immobiliari Genova - v1.0 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cruscotto Messaggi - v1.0</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blu: #14213d;
    --blu2: #2c4a73;
    --blu-scuro: #0e1d33;
    --grigio: #6b7280;
    --grigio-chiaro: #e9edf2;
    --oro: #c9a227;
    --oro-chiaro: #f5d77a;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--grigio-chiaro);
    color: #1f2937;
    min-height: 100vh;
    padding-bottom: 40px;
  }
  header {
    background: linear-gradient(160deg, #1c2f50, var(--blu));
    color: #fff;
    padding: 28px 20px 24px;
    text-align: center;
    border-bottom: 3px solid var(--oro);
    padding-top: calc(28px + env(safe-area-inset-top, 0px));
  }
  header h1 { font-size: 20px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
  header p { font-size: 13px; color: #c7d2e3; margin-top: 6px; }
  .versione {
    display: inline-block;
    margin-top: 10px;
    font-size: 11px;
    color: var(--blu);
    background: var(--oro-chiaro);
    border-radius: 20px;
    padding: 3px 12px;
    font-weight: 600;
  }

  main { max-width: 560px; margin: 0 auto; padding: 20px 16px; }

  .tabs { display: flex; gap: 12px; margin-bottom: 20px; }
  .tab {
    flex: 1;
    padding: 14px 10px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    background: linear-gradient(#ffffff, #dfe5ee);
    color: var(--blu);
    box-shadow: 0 5px 0 #b8c2d1, 0 8px 14px rgba(20,33,61,.18);
    transition: transform .08s, box-shadow .08s;
  }
  .tab.attiva {
    background: linear-gradient(#2c4a73, var(--blu));
    color: var(--oro-chiaro);
    box-shadow: 0 5px 0 var(--blu-scuro), 0 8px 14px rgba(20,33,61,.35);
  }
  .tab:active { transform: translateY(3px); }

  .card {
    background: #fff;
    border-radius: 18px;
    padding: 20px 18px;
    box-shadow: 0 4px 18px rgba(20,33,61,.08);
    margin-bottom: 18px;
  }
  .field { margin-bottom: 16px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label {
    display: block;
    font-size: 12px;
    color: var(--grigio);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
    font-weight: 600;
  }
  input, select {
    width: 100%;
    background: #f7f9fc;
    border: 1px solid #d5dce6;
    border-radius: 12px;
    padding: 13px 14px;
    color: #111827;
    font-size: 16px; /* evita lo zoom automatico su iPhone */
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--grigio) 50%),
                      linear-gradient(135deg, var(--grigio) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  input:focus, select:focus { border-color: var(--oro); box-shadow: 0 0 0 3px rgba(201,162,39,.18); }
  .hint-small { font-size: 12px; color: var(--grigio); margin-top: 6px; }

  .stato-vie {
    font-size: 12px;
    color: var(--blu2);
    background: #eef3fa;
    border-radius: 10px;
    padding: 9px 12px;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .btn-piccolo {
    margin-top: 8px;
    background: linear-gradient(#ffffff, #dfe5ee);
    color: var(--blu);
    border: none;
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 3px 0 #b8c2d1;
  }
  .btn-piccolo:active { transform: translateY(2px); box-shadow: 0 1px 0 #b8c2d1; }

  .preview-label {
    font-size: 12px;
    color: var(--grigio);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .preview-box {
    background: #f7f9fc;
    border: 1px solid #d5dce6;
    border-left: 4px solid var(--oro);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.7;
    color: #374151;
    min-height: 90px;
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 20px;
  }

  .btn3d {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    background: linear-gradient(#2c4a73, var(--blu));
    color: var(--oro-chiaro);
    border: none;
    border-radius: 14px;
    padding: 17px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.3px;
    box-shadow: 0 6px 0 var(--blu-scuro), 0 10px 18px rgba(20,33,61,.3);
    transition: transform .08s, box-shadow .08s, opacity .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn3d:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--blu-scuro), 0 4px 8px rgba(20,33,61,.25); }
  .btn3d.off { opacity: 0.4; pointer-events: none; }
  .hint { font-size: 12px; color: var(--grigio); text-align: center; margin-top: 12px; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>Cruscotto Messaggi</h1>
  <p>Servizi Immobiliari Genova · Francesco</p>
  <span class="versione">v1.0</span>
</header>

<main>

  <div class="tabs">
    <button class="tab attiva" id="tabAnticipo" onclick="setTab('anticipo')">Anticipo</button>
    <button class="tab" id="tabConferma" onclick="setTab('conferma')">Conferma</button>
  </div>

  <div class="card">

    <div class="field">
      <label>Numero WhatsApp (con prefisso)</label>
      <input type="tel" id="numero" placeholder="+393331234567" oninput="aggiorna()">
    </div>

    <div class="field">
      <label>Via</label>
      <input type="text" id="via" list="listaVie" placeholder="Inizia a scrivere, es. Via Ro..." autocomplete="off" oninput="aggiorna()">
      <datalist id="listaVie"></datalist>
      <div class="stato-vie" id="statoVie">Carico le vie di Genova...</div>
      <button class="btn-piccolo" onclick="caricaVie(true)">🔄 Aggiorna elenco vie</button>
    </div>

    <div class="row">
      <div class="field">
        <label>Civico</label>
        <input type="text" id="civico" placeholder="es. 12" oninput="aggiorna()">
      </div>
      <div class="field">
        <label>Orario</label>
        <input type="text" id="orario" placeholder="es. 17:30" oninput="aggiorna()">
      </div>
    </div>

    <div class="field" id="campoData">
      <label>Data (gg/mm)</label>
      <input type="text" id="data" placeholder="es. 18/2" oninput="aggiorna()">
    </div>

    <div class="row">
      <div class="field">
        <label>Saluto</label>
        <select id="saluto" onchange="aggiorna()">
          <option value="auto">Automatico</option>
          <option value="Buongiorno">Buongiorno</option>
          <option value="Buonasera">Buonasera</option>
        </select>
        <div class="hint-small">Ora: <span id="salutoAdesso">-</span></div>
      </div>
    </div>

  </div>

  <div class="preview-label">Anteprima messaggio</div>
  <div class="preview-box" id="preview">Compila i campi qui sopra...</div>

  <a class="btn3d off" id="sendBtn" href="#">📲 Apri in WhatsApp</a>
  <p class="hint">Il testo sarà già scritto: premi solo Invia</p>

</main>

<script>
// ===== IMPOSTAZIONI =====
var ORA_SERA = 18; // dalle 18:00 in poi dice "Buonasera"
var OVERPASS = 'https://overpass-api.de/api/interpreter';
// Tutte le vie con nome del Comune di Genova, prese da OpenStreetMap
var QUERY_VIE = '[out:json][timeout:60];area["name"="Genova"]["admin_level"="8"]->.a;way["highway"]["name"](area.a);out tags;';
var CACHE_KEY = 'cruscotto_vie_genova_v1';
var CACHE_GIORNI = 30;

var tabAttiva = 'anticipo';
var vie = [];

// ===== SALUTO =====
function saluto() {
  var scelta = document.getElementById('saluto').value;
  if (scelta !== 'auto') return scelta;
  return new Date().getHours() < ORA_SERA ? 'Buongiorno' : 'Buonasera';
}

// ===== TESTI =====
function indirizzo() {
  var via = val('via');
  var civico = val('civico');
  return via + (civico ? ' ' + civico : '');
}

function testoAnticipo() {
  var orario = val('orario');
  return saluto() + ", sono Francesco. Mi trovo già in zona e vorrei sapere se fosse possibile anticipare l'appuntamento previsto in " + indirizzo() + " alle " + orario + ". Qualora non fosse possibile, confermo che l'appuntamento resterà alle " + orario + " come da programma. La ringrazio per la disponibilità e resto in attesa di un suo riscontro. Cordiali saluti.";
}

function testoConferma() {
  var data = val('data');
  var orario = val('orario');
  return saluto() + " \u2014 sono Francesco, volevo sapere se l'appuntamento in " + indirizzo() + " di oggi " + data + " alle " + orario + " \u00e8 confermato. Rimango a disposizione.";
}

function val(id) {
  return document.getElementById(id).value.trim();
}

// ===== AGGIORNA ANTEPRIMA E PULSANTE =====
function aggiorna() {
  var isAnticipo = tabAttiva === 'anticipo';
  var numero = val('numero').replace(/\s/g, '').replace(/^\+/, '');
  var via = val('via');
  var civico = val('civico');
  var orario = val('orario');
  var data = val('data');

  document.getElementById('salutoAdesso').textContent = new Date().getHours() < ORA_SERA && document.getElementById('saluto').value === 'auto' ? 'Buongiorno' : (document.getElementById('saluto').value === 'auto' ? 'Buonasera' : saluto());

  var testoCompleto = via && civico && orario && (isAnticipo || data);
  var testo = '';
  if (testoCompleto) {
    testo = isAnticipo ? testoAnticipo() : testoConferma();
  }

  document.getElementById('preview').textContent = testoCompleto ? testo : 'Compila i campi qui sopra...';

  var btn = document.getElementById('sendBtn');
  if (testoCompleto && numero) {
    btn.href = 'https://wa.me/' + numero + '?text=' + encodeURIComponent(testo);
    btn.classList.remove('off');
  } else {
    btn.href = '#';
    btn.classList.add('off');
  }
}

// ===== CAMBIO SCHEDA =====
function setTab(t) {
  tabAttiva = t;
  document.getElementById('tabAnticipo').classList.toggle('attiva', t === 'anticipo');
  document.getElementById('tabConferma').classList.toggle('attiva', t === 'conferma');
  document.getElementById('campoData').classList.toggle('hidden', t === 'anticipo');
  aggiorna();
}

// ===== VIE DI GENOVA DAL WEB =====
function riempiLista() {
  var lista = document.getElementById('listaVie');
  lista.innerHTML = '';
  var frag = document.createDocumentFragment();
  vie.forEach(function (nome) {
    var opt = document.createElement('option');
    opt.value = nome;
    frag.appendChild(opt);
  });
  lista.appendChild(frag);
}

function leggiCache() {
  try {
    var raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function salvaCache(elenco) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), v: elenco }));
  } catch (e) { /* memoria piena o bloccata: ignoro */ }
}

function mostraStato(testo) {
  document.getElementById('statoVie').textContent = testo;
}

function caricaVie(forza) {
  var cache = leggiCache();
  var cacheValida = cache && (Date.now() - cache.t) < CACHE_GIORNI * 86400000;

  if (!forza && cacheValida) {
    vie = cache.v;
    riempiLista();
    mostraStato('Vie di Genova caricate: ' + vie.length + ' (elenco salvato sul dispositivo)');
    return;
  }

  mostraStato('Carico le vie di Genova dal web... (può volerci qualche secondo)');

  var controller = new AbortController();
  var timeout = setTimeout(function () { controller.abort(); }, 60000);

  fetch(OVERPASS, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'data=' + encodeURIComponent(QUERY_VIE),
    signal: controller.signal
  })
  .then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(function (json) {
    clearTimeout(timeout);
    var set = {};
    json.elements.forEach(function (e) {
      if (e.tags && e.tags.name) set[e.tags.name.trim()] = true;
    });
    var elenco = Object.keys(set).sort(function (a, b) { return a.localeCompare(b, 'it'); });
    if (elenco.length === 0) throw new Error('elenco vuoto');
    vie = elenco;
    salvaCache(vie);
    riempiLista();
    mostraStato('Vie di Genova caricate: ' + vie.length);
  })
  .catch(function () {
    clearTimeout(timeout);
    if (cache && cache.v && cache.v.length) {
      vie = cache.v;
      riempiLista();
      mostraStato('Connessione assente o lenta: uso l\'elenco salvato (' + vie.length + ' vie)');
    } else {
      mostraStato('Non riesco a caricare le vie. Puoi scriverla a mano.');
    }
  });
}

// ===== AVVIO =====
document.getElementById('campoData').classList.add('hidden');
aggiorna();
caricaVie(false);
setInterval(aggiorna, 60000); // aggiorna il saluto quando cambia l'ora
</script>

</body>
</html>
